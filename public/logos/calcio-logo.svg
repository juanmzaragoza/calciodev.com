<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .calcio-dark { fill: #00733c; }
      .calcio-light { fill: #4db560; }
      .calcio-white { fill: #ffffff; }
      .calcio-blue { fill: #007bff; }
    </style>
  </defs>
  
  <!-- CALCIO Logo Icon -->
  <g transform="translate(256, 256) scale(1.5)">
    <!-- Main swirl shape - dark green -->
    <path class="calcio-dark" d="M -80 -20 Q -120 0 -100 60 Q -40 100 40 120 Q 120 100 140 20 Q 140 -40 80 -80 Q 20 -120 -80 -20 Z" />
    
    <!-- Light green accent -->
    <path class="calcio-light" d="M -60 30 Q -80 50 -50 80 Q 0 110 60 100" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top curve - medium green -->
    <path class="calcio-dark" d="M -40 -60 Q -80 -40 -60 10 Q -20 30 40 20" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" />
    
    <!-- White accents -->
    <circle class="calcio-white" cx="-50" cy="10" r="14" />
    <circle class="calcio-white" cx="50" cy="-30" r="12" />
  </g>
</svg>
